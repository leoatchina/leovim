id = "vim-herdr-navigation"
name = "Vim Herdr Navigation"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Seamless Ctrl+h/j/k/l navigation across herdr panes and Vim/Neovim splits"
platforms = ["linux", "macos", "windows"]

# One action per direction. Each is bound to a direct chord in herdr's config
# (see README). The action forwards the key into Vim when the focused pane is
# running Vim/Neovim, otherwise it moves herdr's pane focus.

[[actions]]
id = "left"
title = "Navigate left (Vim/herdr)"
contexts = ["global"]
platforms = ["linux", "macos"]
command = ["bash", "navigate.sh", "left"]

[[actions]]
id = "down"
title = "Navigate down (Vim/herdr)"
contexts = ["global"]
platforms = ["linux", "macos"]
command = ["bash", "navigate.sh", "down"]

[[actions]]
id = "up"
title = "Navigate up (Vim/herdr)"
contexts = ["global"]
platforms = ["linux", "macos"]
command = ["bash", "navigate.sh", "up"]

[[actions]]
id = "right"
title = "Navigate right (Vim/herdr)"
contexts = ["global"]
platforms = ["linux", "macos"]
command = ["bash", "navigate.sh", "right"]

# Windows twins: same directions, cmd entry point (bash not assumed on PATH).
# Detection differs from navigate.sh: herdr cannot track foreground processes
# on Windows, so navigate.cmd checks the "vim-herdr-nav" pane token that the
# editor side reports while Vim is running.

[[actions]]
id = "left-win"
title = "Navigate left (Vim/herdr, Windows)"
contexts = ["global"]
platforms = ["windows"]
command = ["cmd", "/c", "navigate.cmd", "left"]

[[actions]]
id = "down-win"
title = "Navigate down (Vim/herdr, Windows)"
contexts = ["global"]
platforms = ["windows"]
command = ["cmd", "/c", "navigate.cmd", "down"]

[[actions]]
id = "up-win"
title = "Navigate up (Vim/herdr, Windows)"
contexts = ["global"]
platforms = ["windows"]
command = ["cmd", "/c", "navigate.cmd", "up"]

[[actions]]
id = "right-win"
title = "Navigate right (Vim/herdr, Windows)"
contexts = ["global"]
platforms = ["windows"]
command = ["cmd", "/c", "navigate.cmd", "right"]
